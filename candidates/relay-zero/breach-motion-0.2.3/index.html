<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#172c39"><title>零号中继 · 石城爆破</title><meta name="description" content="原创第一人称单人爆破：自由移动，掩体交火，抵达A点安包并守住。"><link rel="stylesheet" href="style.css"></head><body><main id="stage">
<header><div class="brand"><b>R<span>/</span>Z</b><div>零号中继<small>STONE BREACH</small></div></div><div id="objective">A 点 · 安包</div><nav><button id="mute" aria-label="关闭声音"><span id="soundIcon">♫</span></button><button id="pause" aria-label="暂停">Ⅱ</button><button id="settings" aria-label="设置与存档">⚙</button></nav></header>
<div class="board"><canvas id="game" width="960" height="620" tabindex="0" aria-label="第一人称爆破游戏。先安全准备视角；点击场景开战并射击。方向键移动，鼠标瞄准。到A点停下自动安包，移动取消。"></canvas>
<div class="topHud"><span id="enemyCount">守卫 3</span><strong id="clock">1:30</strong><span id="compass">A →</span></div><div id="centerHint" aria-live="polite"></div><div id="progressWrap" hidden><div id="progressBar"></div></div><div id="hitmark" hidden>×</div><div id="hurt"></div>
<div class="bottomHud"><div><small>生命</small><b id="health">100</b><div class="healthTrack"><i id="healthBar"></i></div></div><div id="roundHint">绕过石楼，前往 A 点</div><div class="ammo"><b id="ammo">20</b><small id="ammoLabel">自动换弹</small></div></div>
<div id="practiceCard" hidden><b>安全准备</b><span id="practiceHelp"></span><small id="practiceFire"></small><button id="beginRound">准备好，开战</button></div><div id="overlay"><section><span id="resultIcon">A</span><h1 id="resultTitle">石城爆破</h1><p id="resultDetail">到 A 点停下安包，然后守住</p><button id="resume" class="primary">准备视角</button><button id="fallback" class="secondary" hidden>改用右键拖动</button><button id="reloadAssets" class="secondary" hidden>重试画面加载</button><button id="retry" class="secondary" hidden>重开本局</button><p id="startControls">↑ ↓ ← → 移动　鼠标瞄准　左键射击</p></section></div></div>
<footer><span>↑ ↓ ← → 移动</span><span>鼠标瞄准 · 左键射击</span><span id="rightHelp">右键 精瞄</span><button id="lock">锁定鼠标</button></footer><p id="storageNotice" role="status" hidden></p><p id="inputNotice" role="status" hidden></p><p class="mobileNote">请使用电脑方向键和鼠标游玩</p>
<dialog id="settingsDialog"><form method="dialog"><button class="close" aria-label="关闭设置">×</button></form><h2>设置与进度</h2><button id="comfort">舒适视角：关</button><p id="record"></p><p class="subtle">仅存于此浏览器。旧版存档已保留。</p><div class="settingsActions"><button id="export">导出进度</button><label class="button" for="import">导入进度<input id="import" type="file" accept="application/json,.json" hidden></label><button id="reset" class="danger">重置新版进度</button></div><p id="settingsStatus" role="status"></p></dialog>
<dialog id="confirmDialog"><h2 id="confirmTitle">确认？</h2><p id="confirmText"></p><div class="settingsActions"><button id="cancel">取消</button><button id="confirm" class="danger">确认</button></div></dialog>
</main><script src="core.js"></script><script type="module" src="app.js"></script></body></html>
