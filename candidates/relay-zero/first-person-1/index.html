<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#08131d"><meta name="description" content="零号中继：第一人称射击。方向键移动，鼠标瞄准射击。击破四台无人机，夺回中继。"><title>零号中继 · RELAY ZERO</title><link rel="stylesheet" href="style.css"></head>
<body><main id="stage">
<header><div class="brand"><b>R<span>/</span>Z</b><div>零号中继<small>RELAY ZERO</small></div></div><div id="objective" role="status">击破红色无人机 <b>0 / 4</b></div><nav><button id="mute" aria-label="关闭声音" title="声音"><span id="soundIcon">♫</span></button><button id="pause" aria-label="暂停" title="暂停">Ⅱ</button><button id="settings" aria-label="设置与存档" title="设置与存档">⚙</button></nav></header>
<div class="hud"><div id="health" aria-label="护盾 5 格"></div><div id="hint" aria-live="polite">击破红色无人机</div><div id="clock" aria-label="剩余时间">1:30</div></div>
<div class="board"><canvas id="game" width="960" height="620" tabindex="0" aria-label="第一人称射击游戏。上下键前后移动，左右键横移，鼠标瞄准，左键射击，右键护盾。"></canvas><div id="intro"><span class="intro-arrows">↑<br>← ↓ →</span><b>指向红靶，直接开打</b></div><div id="overlay" hidden><section><div id="resultIcon">Ⅱ</div><h1 id="resultTitle">已暂停</h1><p id="resultDetail"></p><button id="resume" class="primary">继续</button><button id="retry" class="secondary">再来一局</button></section></div><div id="hurt"></div></div>
<footer><div class="controls"><span><b>↑ ↓</b> 前后 <b>← →</b> 横移</span><span><svg viewBox="0 0 24 30" aria-hidden="true"><rect x="3" y="2" width="18" height="26" rx="9"/><path class="lit" d="M12 2a9 9 0 0 0-9 9v3h9Z"/><path d="M12 2v12M3 14h18"/></svg>左键 射击</span><span id="shieldLabel"><svg viewBox="0 0 24 30" aria-hidden="true"><rect x="3" y="2" width="18" height="26" rx="9"/><path class="lit" d="M12 2a9 9 0 0 1 9 9v3h-9Z"/><path d="M12 2v12M3 14h18"/></svg>右键 护盾 <i id="shieldTime">●</i></span></div><div class="ammo"><span id="ammoLabel">自动换弹</span><div id="ammoDots"></div></div></footer>
<p id="storageNotice" role="status" hidden></p><p class="mobileNote">请使用电脑方向键和鼠标游玩</p>
<dialog id="settingsDialog"><form method="dialog"><button class="close" aria-label="关闭设置">×</button></form><h2>本地进度</h2><p id="record"></p><p class="subtle">仅存于此浏览器。旧版存档已保留。</p><div class="settingsActions"><button id="export">导出进度</button><label class="button" for="import">导入进度<input id="import" type="file" accept="application/json,.json" hidden></label><button id="reset" class="danger">重置新版进度</button></div><p id="settingsStatus" role="status"></p></dialog>
<dialog id="confirmDialog"><h2 id="confirmTitle">重置新版进度？</h2><p id="confirmText">本版记录与未完成回合将被清除。</p><div class="settingsActions"><button id="cancel">取消</button><button id="confirm" class="danger">确认</button></div></dialog>
</main><script src="core.js"></script><script type="module" src="app.js"></script></body></html>
