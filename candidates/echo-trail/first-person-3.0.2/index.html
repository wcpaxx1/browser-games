<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#081e2e"><meta name="description" content="从潜艇驾驶窗看前方通道。方向键前后移动、左右转向，点击发出声呐，找到金色出口。"><title>回声探路</title><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css"><script src="core.js" defer></script><script src="storage.js" defer></script><script src="view.js" defer></script><script src="app.js" defer></script></head><body>
<div class="water" aria-hidden="true"></div><div class="app">
<header><a href="#" id="home" class="logo" aria-label="回到第一关"><img src="icon.svg" alt=""><span>回声探路</span></a><nav id="levels" aria-label="关卡"></nav><button id="settings-button" class="small-button" aria-label="设置与存档" title="设置"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 4v4M16 24v4M4 16h4M24 16h4M7.5 7.5l3 3M21.5 21.5l3 3M7.5 24.5l3-3M21.5 10.5l3-3"/><circle cx="16" cy="16" r="8"/><circle cx="16" cy="16" r="3"/></svg></button></header>
<main><div class="message-row"><span id="hint">去金圈　↑↓按住走　←→转</span><button id="storage-warning" class="storage-warning" hidden>进度未保存</button></div>
<div class="chart-wrap"><canvas id="board" width="960" height="640" tabindex="0" role="img" aria-label="潜艇驾驶视角。上前进、下后退、左右转向。鼠标左键照亮前方，找到金色出口。"></canvas><div id="pause-overlay" class="overlay" hidden><button id="resume-button" class="round-button" aria-label="继续探路">▶</button></div><div id="finish-overlay" class="overlay finish" hidden><div><p class="five-lights" aria-hidden="true">● ● ● ● ●</p><h1>到家啦</h1><button id="replay-button" class="replay-button" aria-label="从第一关再玩一次">↻ 再玩</button></div></div></div>
<div class="controls"><div class="keypad" aria-label="移动"><button data-dir="left" aria-label="向左转90度" title="左转">←</button><div><button data-dir="up" aria-label="向前走一格" title="前进">↑</button><button data-dir="down" aria-label="向后退一格" title="后退">↓</button></div><button data-dir="right" aria-label="向右转90度" title="右转">→</button></div><span class="control-divider" aria-hidden="true"></span><button id="pulse-button" class="pulse-button" aria-label="发出声呐照亮前方" title="鼠标左键照亮"><svg viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="16"/><circle cx="22" cy="22" r="10"/><circle cx="22" cy="22" r="3"/></svg><span>照亮</span></button><button id="retry-button" class="retry-button" aria-label="重走本关" title="重走本关">↻</button></div>
<p class="keyboard-hint" aria-hidden="true"><span>↑↓ 按住 · ←→ 点按</span><svg viewBox="0 0 22 28"><rect x="3" y="2" width="16" height="24" rx="8"/><path d="M11 2v11H3M11 13h8"/><path d="M10 3Q4 4 4 10v2h6Z" fill="currentColor"/></svg><span>鼠标左键</span></p>
</main><footer><span id="level-count">1 / 5</span><span>ECHO TRAIL · 3.0.2</span></footer>
</div>
<dialog id="settings-dialog"><div class="dialog-heading"><h2>设置</h2><button id="settings-close" class="small-button" aria-label="关闭设置">×</button></div><label>减少动画<input id="motion-setting" type="checkbox"></label><label>高对比<input id="contrast-setting" type="checkbox"></label><div class="save-actions"><button id="export-button">导出进度</button><button id="import-button">导入进度</button><button id="original-button" hidden>备份旧存档</button><button id="reset-button">重置进度</button></div><p id="storage-description" class="note">进度仅在此浏览器保存。</p><p id="settings-feedback" class="note" role="status"></p><input id="import-file" type="file" accept="application/json,.json" hidden></dialog>
<dialog id="confirm-dialog"><h2 id="confirm-title">替换进度？</h2><p id="confirm-copy"></p><div class="confirm-actions"><button id="confirm-cancel">取消</button><button id="confirm-ok">确认</button></div></dialog>
<div id="announcer" class="sr-only" role="status" aria-live="polite"></div><noscript>启用 JavaScript 即可玩。</noscript></body></html>
