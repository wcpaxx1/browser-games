<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#244A63"><meta name="description" content="纸雨回拍：第一人称近身拍返，原创木版纸艺场景，30秒一局。"><title>纸雨回拍</title><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css"></head>
<body><main id="game" aria-label="纸雨回拍，第一人称近身拍返游戏">
<canvas id="scene" tabindex="0" aria-label="场地。方向键移动，鼠标转向，左键拍返，右键格挡。"></canvas><svg id="vector-scene" xmlns="http://www.w3.org/2000/svg" hidden aria-hidden="true"></svg>
<header class="hud"><div class="wordmark"><small>紙 / RAIN</small><b>纸雨回拍</b></div><div class="scoreboard" aria-label="本局成绩"><span id="timer">30</span><span class="divider">/</span><span id="score">0</span><span class="goal">● ● ●</span></div><div class="tools"><button id="mute" aria-label="关闭声音" title="声音">♪</button><button id="pause" aria-label="暂停" title="暂停">Ⅱ</button><button id="saves" aria-label="存档" title="存档">↥</button></div></header>
<div id="overlay" class="overlay"><section class="card" aria-labelledby="overlay-title"><span class="eyebrow">一张纸 · 一次回响</span><h1 id="overlay-title">纸雨回拍</h1><p id="subtitle">30 秒，拍中大靶</p><div class="control-strip" aria-label="操作"><span><i class="arrows">↑<br>← ↓ →</i><small>移动</small></span><span><i class="mouse-icon"><em></em></i><small>转向</small></span><span><i class="mouse-icon left"><em></em></i><small>左 · 拍</small></span><span><i class="mouse-icon right"><em></em></i><small>右 · 挡</small></span></div><button id="primary" class="primary" disabled>载入纸面…</button><button id="new" class="quiet" hidden>重新开始</button><span id="best" class="best">最佳 0</span><small class="cultural">原创木版纸艺场景 · 非历史运动复原</small></section></div>
<div id="hint" class="hint" hidden><span class="mouse-icon left"><em></em></span><span>近了，拍</span></div>
<div id="status" class="status" role="status" aria-live="polite"></div>
<div class="touch-controls" aria-label="触屏操作"><div class="dpad"><button data-key="ArrowUp" aria-label="向前">↑</button><button data-key="ArrowLeft" aria-label="向左">←</button><button data-key="ArrowDown" aria-label="向后">↓</button><button data-key="ArrowRight" aria-label="向右">→</button></div><div class="touch-actions"><button id="touch-guard" aria-label="按住格挡">挡</button><button id="touch-hit" aria-label="拍返">拍</button></div></div>
<dialog id="save-panel" aria-labelledby="save-title"><form method="dialog"><button id="close-save" class="close" aria-label="关闭存档">×</button></form><h2 id="save-title">这一页</h2><p id="save-status">只保存在这个浏览器中。</p><div class="save-buttons"><button id="export">导出</button><label class="button" for="import">导入<input id="import" type="file" accept="application/json,.json" hidden></label><button id="reload-save" hidden>载入最新</button><button id="reset">清空</button></div><p id="import-status" role="status"></p><button id="confirm-import" class="primary" hidden>替换存档</button><div id="reset-confirm" hidden><p>清空本游戏的成绩与进度？</p><button id="confirm-reset">确认清空</button><button id="cancel-reset">保留</button></div><small>存档不跨浏览器；清理网站数据会删除存档。原型 0.1.3。</small></dialog>
<noscript>此游戏需要启用 JavaScript。</noscript>
</main><script src="core.js"></script><script src="input.js"></script><script src="save.js"></script><script src="view.js"></script><script src="raster.js"></script><script src="game.js"></script></body></html>
