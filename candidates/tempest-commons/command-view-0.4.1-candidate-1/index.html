<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#152c37"><title>暮潮前哨 · 小队指挥</title><link rel="stylesheet" href="style.css">
<body><main id="game"><header><div class="brand">暮潮前哨 <span>小队指挥</span></div><div><button id="home" title="回到小队与目标" aria-label="回到小队与目标">⌖ 全景</button><button id="pause" aria-label="暂停战局">Ⅱ 暂停</button></div></header>
<section id="mission"><strong>摧毁红色前哨，至少保住 1 辆蓝色坦克。</strong><span id="hint">左键点蓝色坦克，或拖框选择小队</span><span id="receipt" role="status" aria-live="polite"></span></section>
<section id="field"><canvas id="battle" tabindex="0" aria-label="战场。左键选择蓝色坦克，右键移动或攻击红色目标。方向键移动镜头。"></canvas><div id="legend"><span class="blue">● 你的坦克</span><span class="red">◆ 敌军</span></div><div id="camera-hint">方向键移动视野 · 滚轮缩放</div></section>
<footer><div id="squad"><button id="select-all" title="选择全部存活坦克">▣ 全选</button><div id="cards"></div></div><div id="orders"><button id="stop" title="停止移动（S）">■ 停止</button><button id="touch-order">◎ 点击下令</button><span id="control-hint">左键选择 / 拖框　右键移动 / 攻击</span></div></footer>
<div id="shade" hidden><section class="panel" id="pause-panel" hidden><h1>战局暂停</h1><button id="resume" class="primary">▶ 继续</button><div class="row"><button id="save">另存</button><button id="export">导出</button><button id="import">导入</button></div><div class="row"><select id="slots" aria-label="选择旧进度"></select><button id="load">读取</button></div><button id="restart">重新开始</button><small>进度只保存在此浏览器。导出文件可作备份。</small><p id="notice" role="status"></p></section>
<section class="panel" id="confirm-panel" role="dialog" aria-modal="true" aria-labelledby="confirm-title" hidden><h1 id="confirm-title">重新开始这一局？</h1><p>先把当前进度保留到独立存档。</p><div class="row"><button id="cancel-restart" class="primary">返回</button><button id="confirm-restart">重新开始</button></div><p id="confirm-notice" role="status"></p></section>
<section class="panel" id="result-panel" hidden><h1 id="result-title"></h1><p id="result-detail"></p><button id="again" class="primary">↻ 再来一局</button><button id="result-export">导出战局</button><p id="result-notice" role="status"></p></section></div>
<input id="file" type="file" accept="application/json,.json" hidden><noscript>请启用 JavaScript 运行此游戏。</noscript></main><script src="engine.js"></script><script src="scenario.js"></script><script src="timeline.js"></script><script src="save.js"></script><script src="session.js"></script><script src="view.js"></script><script src="app.js"></script></body></html>
