<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123e48"><title>潮汐渡口 · 船首快递</title><link rel="icon" href="icon.svg"><link rel="stylesheet" href="style.css"><script src="core.js" defer></script><script src="storage.js" defer></script><script src="projection.js" defer></script><script src="app.js" defer></script></head><body>
<main class="game"><header><h1>潮汐渡口 <small>船首快递</small></h1><div class="tools"><button id="pause" aria-label="暂停" title="暂停"><svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg></button><button id="retry" aria-label="重试这一程" title="重试这一程"><svg viewBox="0 0 24 24"><path d="M5 9a8 8 0 1 1-1 6M5 3v6h6"/></svg></button><button id="save" aria-label="存档与设置" title="存档与设置"><svg viewBox="0 0 24 24"><path d="M4 3h13l4 4v14H4zM8 3v7h9V3M8 21v-7h9v7"/></svg><i id="save-warning" hidden></i></button></div></header>

<div class="water-frame"><canvas id="water" tabindex="0" role="application" aria-label="划船区域。上/下键前进后退，左/右键转向，左键点前方水面或码头。接触货箱自动装船，送到亮灯码头。右键可选急停。"></canvas><div id="overlay" class="overlay" hidden><div class="result-card"><div id="result-icon"></div><h2 id="result-title"></h2><button id="result-action" class="primary" aria-label="继续划船"></button></div></div></div>
<footer><div class="control-icons" aria-label="上/下键前后移动，左/右键转向，左键指定目的地，右键急停（可选）"><span class="arrowkeys" title="方向键划船"><svg viewBox="0 0 64 32"><path d="M29 5l3-3 3 3M32 2v10M29 27l3 3 3-3M32 20v10M8 21l-4 4 4 4M4 25h11M51 21l4 4-4 4M44 25h11"/></svg></span><span class="mouse" title="左键指定目的地"><svg viewBox="0 0 46 32"><rect x="3" y="2" width="17" height="27" rx="8"/><path d="M3 13h17M12 2v11"/><path d="M5 12V9q0-5 6-5v8" class="fill"/><path d="M27 16h13m-4-4 4 4-4 4"/></svg></span><span class="mouse" title="右键急停，可选"><svg viewBox="0 0 46 32"><rect x="3" y="2" width="17" height="27" rx="8"/><path d="M3 13h17M12 2v11"/><path d="M13 4q5 1 5 6v2h-5" class="fill"/><path d="M29 10v12M36 10v12"/></svg></span></div><span class="version">船首视角候选 3.0.1</span></footer>
